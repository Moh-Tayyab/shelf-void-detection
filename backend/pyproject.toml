[project]
name = "shelf-void-api"
version = "0.1.0"
description = "Shelf void detection backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "python-multipart>=0.0.32",
    "ultralytics>=8.4.89",
    "uvicorn[standard]>=0.50.1",
]

[tool.uv]
override-dependencies = ["torch>=2.0.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
